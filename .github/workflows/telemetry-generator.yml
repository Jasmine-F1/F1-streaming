name: telemetry-generator

on:
  push:
    branches: [main]
    paths:
      - "apps/telemetry-generator/**"
      - ".github/workflows/telemetry-generator.yml"
  pull_request:
    paths:
      - "apps/telemetry-generator/**"
      - ".github/workflows/telemetry-generator.yml"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/telemetry-generator

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/telemetry-generator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest
      - run: pytest -v

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: apps/telemetry-generator
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

# Stops at push — deployment is ArgoCD's job (Week 2, Day 8-9 GitOps sync),
# not this workflow's.
