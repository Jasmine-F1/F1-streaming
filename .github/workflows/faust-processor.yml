name: faust-processor

on:
  push:
    branches: [main]
    paths:
      - "apps/faust-processor/**"
      - ".github/workflows/faust-processor.yml"
  pull_request:
    paths:
      - "apps/faust-processor/**"
      - ".github/workflows/faust-processor.yml"

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/faust-processor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest
      - run: pytest -v

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Compute image name
        # GHCR requires an all-lowercase repository path; github.repository
        # ("Jasmine-F1/F1-streaming") has uppercase letters, so it can't be
        # interpolated directly into the tag (docker/build-push-action fails
        # with "invalid reference format: repository name must be lowercase").
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}/faust-processor' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: apps/faust-processor
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

# Stops at push — deployment is ArgoCD's job (Week 2, Day 8-9 GitOps sync),
# not this workflow's.
