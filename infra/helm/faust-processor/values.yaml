image:
  repository: faust-processor
  tag: local
  pullPolicy: Never

replicaCount: 1

args: ["worker", "-l", "info"]

env:
  kafkaBootstrapServers: "kafka.pipeline.svc.cluster.local:9092"
  inputTopic: "f1.telemetry"
  outputTopic: "f1.telemetry.processed"
  appId: "f1-faust-processor"
  webPort: 6066

service:
  port: 6066

# Both require the Prometheus Operator CRDs (installed by kube-prometheus-
# stack) to already exist in the cluster — set to false if deploying
# faust-processor somewhere without them.
serviceMonitor:
  enabled: true
prometheusRule:
  enabled: true

resources: {}
